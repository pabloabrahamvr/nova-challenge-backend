services:
  app:
    build:
      context: .
      target: runtime
    image: guardian-gateway:local
    ports:
      # Loopback only: the API has no authentication, so it must not be reachable from the network.
      # Put a reverse proxy / gateway with auth and TLS in front before exposing it.
      - "127.0.0.1:3000:3000"
    # Non-secret tunables come from a local, git-ignored .env (optional).
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "3000"
      AUDIT_FILE_PATH: /app/data/audit.jsonl
      # The encryption key is a Docker secret mounted as a file, NOT an environment variable, so it does not
      # show up in `docker compose config`, `docker inspect` or /proc/<pid>/environ.
      AUDIT_ENCRYPTION_KEY_FILE: /run/secrets/audit_encryption_key
    secrets:
      - audit_encryption_key
    volumes:
      - audit-data:/app/data
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

secrets:
  audit_encryption_key:
    file: ./secrets/audit_encryption_key

volumes:
  audit-data:
